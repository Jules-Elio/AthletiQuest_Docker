networks:
  database:
    external: false

services:
  postgres_athletiquest:
    image: postgis/postgis:17-3.5-alpine
    container_name: postgresql_athletiquest
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DATABASE}
    ports:
      - '5432:5432'
    volumes:
      - db_data_postgresql:/var/lib/postgresql/data
    networks:
      - database

  mongodb_athletiquest:
    image: mongo:8.0.10
    container_name: mongodb_athletiquest
    restart: unless-stopped
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_USER}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_PASSWORD}
      - MONGO_INITDB_DATABASE=${MONGO_DATABASE}
    ports:
      - '27017:27017'
    volumes:
      - db_data_mongodb:/data/db
    networks:
      - database

  athletiquest_api:
    image: ghcr.io/jules-elio/athletiquest_api:latest
    pull_policy: always
    container_name: api_athletiquest
    restart: unless-stopped
    depends_on:
      - postgres_athletiquest
      - mongodb_athletiquest
    ports:
      - '8080:8080'
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres_athletiquest:5432/${POSTGRES_DATABASE}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_DATA_MONGODB_URI: mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongodb_athletiquest:27017/${MONGO_DATABASE}?authSource=admin
    networks:
      - database

