networks:
  database:
    external: false

services:
  mysql_athletiquest:
    image: mysql:8.4.3-oraclelinux9
    container_name: mysql_athletiquest
    environment:
      MYSQL_ROOT_PASSWORD: athletiquest
      MYSQL_DATABASE: athletiquest
      MYSQL_USER: athletiquest
      MYSQL_PASSWORD: athletiquest
    ports:
      - '3306:3306'
    volumes:
      - ./db_data_mysql:/var/lib/mysql
    networks:
      - database

  mongodb_athletiquest:
    image: mongo:8.0.9
    container_name: mongodb_athletiquest
    environment:
      - MONGO_INITDB_ROOT_USERNAME=athletiquest
      - MONGO_INITDB_ROOT_PASSWORD=athletiquest
      - MONGO_INITDB_DATABASE=athletiquest
    ports:
      - '27017:27017'
    volumes:
      - ./db_data_mongodb:/data/db
    networks:
      - database

  athletiquest_api:
    image: ghcr.io/jules-elio/athletiquest_api:latest
    pull_policy: always
    container_name: api_athletiquest
    depends_on:
      - mysql_athletiquest
      - mongodb_athletiquest
    ports:
      - '8080:8080'
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATA_MONGODB_HOST: mongodb_athletiquest
      SPRING_DATA_MONGODB_PORT: 27017
      SPRING_DATA_MONGODB_DATABASE: athletiquest
    networks:
      - database

